app:
  name: "OncoMouth AI API"
  version: "1.0.0"
  description: "Version 1 API for OncoMouth Oral Cancer Detection"
  api_v1_str: "/api/v1"
  debug: false

model:
  name: "efficientnet_b3"
  weights_path: "../model/calibrated_model.pth"  # Relative to the app running dir
  num_classes: 3
  class_names:
    - "Normal"
    - "Cancer"
    - "PreCancer"
  device: "cpu" # Default to cpu, override in env if needed

preprocessing:
  img_size: 224
  target_stains:
    - [0.5626, 0.2159]
    - [0.7201, 0.8012]
    - [0.4062, 0.5581]
  target_concentrations:
    - [1.9705, 1.0308]
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

inference:
  temperature: 1.3652 # Optimal temperature from calibration
  confidence_threshold: 0.5
  enable_gradcam: true

database:
  url: "sqlite:///./oncomouth.db"

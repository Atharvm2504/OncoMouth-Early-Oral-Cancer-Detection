version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=OncoMouth AI Backend
      - VERSION=1.0.0
      - DEVICE=cpu # Use cpu for cross-platform compatibility out of the box
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - ./backend/app/ml/models/weights:/app/app/ml/models/weights
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
